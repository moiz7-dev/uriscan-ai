<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Android strips color from notification icons (alpha-only).
    Solid white silhouette with a horizontal scan-slot cutout (evenodd),
    so the AI hint survives the alpha mask in the status bar.
    Rendered at 96px so keep strokes thick.
  -->
  <path fill="#FFFFFF" fill-rule="evenodd"
        d="M 512 212 C 512 212 302 458 302 598 A 210 210 0 1 0 722 598 C 722 458 512 212 512 212 Z
           M 340 552 H 684 V 580 H 340 Z"/>
</svg>
