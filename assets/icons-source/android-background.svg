  </g>
  <g fill="#FFFFFF" opacity="0.50">
    <rect x="508" y="92"  width="8" height="28" rx="2"/>
    <rect x="508" y="960" width="8" height="28" rx="2"/>
    <rect x="60"  y="536" width="28" height="8" rx="2"/>
    <rect x="936" y="536" width="28" height="8" rx="2"/>
