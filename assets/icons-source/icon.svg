<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.25" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#93C5FD" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#93C5FD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEF9C3"/>
      <stop offset="0.55" stop-color="#FDE047"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#A5F3FC" stop-opacity="1"/>
      <stop offset="0.85" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="scanBloom" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="dropClip">
      <path d="M 512 212 C 512 212 302 458 302 598 A 210 210 0 1 0 722 598 C 722 458 512 212 512 212 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#bgGlow)"/>

  <!-- HUD ring -->
  <g opacity="0.35" fill="none" stroke="#FFFFFF" stroke-width="3">
    <circle cx="512" cy="540" r="430"/>
  </g>
  <g fill="#FFFFFF" opacity="0.55">
    <rect x="508" y="92"  width="8" height="28" rx="2"/>
    <rect x="508" y="960" width="8" height="28" rx="2"/>
    <rect x="60"  y="536" width="28" height="8" rx="2"/>
    <rect x="936" y="536" width="28" height="8" rx="2"/>
  </g>

  <!-- Droplet -->
  <path d="M 512 212 C 512 212 302 458 302 598 A 210 210 0 1 0 722 598 C 722 458 512 212 512 212 Z"
        fill="url(#drop)"/>

  <!-- Gloss highlight -->
  <ellipse cx="418" cy="450" rx="38" ry="76" fill="#FFFFFF" opacity="0.55"/>
  <ellipse cx="448" cy="380" rx="14" ry="22" fill="#FFFFFF" opacity="0.75"/>

  <!-- Scan line (clipped to droplet) -->
  <g clip-path="url(#dropClip)">
    <rect x="240" y="540" width="544" height="40" fill="url(#scan)" filter="url(#scanBloom)"/>
    <rect x="240" y="556" width="544" height="8"  fill="url(#scan)"/>
  </g>
</svg>
